name: Deploy production
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: windrun-production
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm ci:validate-contract
      - run: pnpm ci:quality
  deploy:
    needs: quality
    if: >-
      vars.PULUMI_CI_ENABLED == 'true' &&
      vars.PULUMI_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/assert-deployment-current.mjs branch main "${{ github.sha }}" production
      - uses: ./.github/actions/auth-cloud
        with:
          pulumi-organization: ${{ vars.PULUMI_ORGANIZATION }}
          gcp-project-id: windrun-ai-prod-20260712
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER_PRODUCTION }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT_PRODUCTION }}
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: ${{ vars.PULUMI_ORGANIZATION }}/windrun-ai/production
          work-dir: infra
          config-map: |
            windrun-ai:stackKind:
              value: production
            windrun-ai:gitCommitSha:
              value: ${{ github.sha }}
      - id: up
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: ${{ vars.PULUMI_ORGANIZATION }}/windrun-ai/production
          work-dir: infra
          config-map: |
            windrun-ai:stackKind:
              value: production
            windrun-ai:gitCommitSha:
              value: ${{ github.sha }}
      - run: |
          set -o pipefail
          pnpm --dir infra exec pulumi stack export --stack "${{ vars.PULUMI_ORGANIZATION }}/windrun-ai/production" | node scripts/ci/validate-app-checkpoint.mjs
      - run: node scripts/ci/smoke-test.mjs https://app.windrun.ai/api/health --attempts 30 --delay-ms 10000
