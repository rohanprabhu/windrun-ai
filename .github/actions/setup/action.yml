name: Setup Windrun
description: Install Node and the repository-pinned pnpm dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
    - shell: bash
      run: corepack enable
    - shell: bash
      run: pnpm install --frozen-lockfile
